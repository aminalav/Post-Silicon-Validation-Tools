name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Build C++ core + Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Native C++ unit tests
        run: |
          cmake -S cpp/tests -B build-cpp-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cpp-tests
          ctest --test-dir build-cpp-tests --output-on-failure

      - name: Install package (compiles pybind11 extension)
        run: pip install -e ".[dev]"

      - name: Verify C++ backend is active
        run: python -c "from sep import core; assert core.BACKEND == 'cpp', core.BACKEND; print('backend:', core.BACKEND)"

      - name: Lint
        run: ruff check sep tests

      - name: Run tests
        run: pytest -q

      - name: PDF report (optional path)
        run: |
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info
          pip install -e ".[dev,reports]"
          sep demo
          sep report LOT001 --pdf --out reports/ci_report
          test -f reports/ci_report.pdf

  frontend:
    name: Build React dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build
        working-directory: frontend
        run: |
          npm install
          npm run build
